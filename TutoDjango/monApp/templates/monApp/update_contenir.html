{% extends 'monApp/base.html' %}
{% block contenu %}
<h1>Mise à jour d'un produit du rayon {{ nomRayon }}</h1>
<form action="" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Valider</button>
    <a href="{% url 'dtl_rayon' rayon.pk %}" class="btn btn-info">Annuler</a>
</form>
{% endblock %}
